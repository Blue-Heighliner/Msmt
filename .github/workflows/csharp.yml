name: C#

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 1.2.3)"
        required: true

# Serializes runs sharing a ref (so two pushes to main never race to git-push an automated commit at the
# same time) and additionally cancels superseded PR runs, since only those are safe to throw away mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Configure git for automated commits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # RestoreLockedMode fails fast if packages.lock.json (also what the setup-dotnet cache key above is
      # keyed on) doesn't match what the project references, instead of silently re-resolving and drifting.
      - name: Build
        run: dotnet build -p:RestoreLockedMode=true

      # On a push to main there is no PR review to catch formatting drift and nothing else depends on this
      # exact commit yet, so fix it automatically instead of failing the run. Everywhere else (PRs, publishes)
      # verify strictly instead: a PR needs the contributor to see and fix the diff, and a publish must build
      # from exactly what's on main, not a silently reformatted copy of it.
      - name: Format
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet format

      - name: Verify formatting
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: dotnet format --verify-no-changes

      # Pushes made with the default GITHUB_TOKEN don't trigger further workflow runs, so this can't loop.
      # continue-on-error so a transient push race never blocks Test/the publish job below.
      - name: Commit formatting fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git add -u -- '*.cs'
          if ! git diff --staged --quiet; then
            git commit -m "Apply dotnet format fixes"
            git push
          fi

      - name: Test
        run: dotnet test Tests/Tests.csproj --configuration Debug --settings Tests/coverage.runsettings --collect:"XPlat Code Coverage"

      - name: Generate coverage badge
        run: |
          dotnet tool restore
          dotnet reportgenerator "-reports:Tests/TestResults/**/coverage.cobertura.xml" "-targetdir:.github/badges" "-reporttypes:Badges"

      # Only the README's own badge file is committed - ReportGenerator's other color/metric variants in
      # .github/badges/ are gitignored. Same can't-loop/continue-on-error reasoning as the formatting commit above.
      - name: Commit updated coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git add .github/badges/badge_linecoverage.svg
          if ! git diff --staged --quiet; then
            git commit -m "Update coverage badge"
            git push
          fi

  publish:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      # Dispatching this workflow already requires write access, but publishing is significant enough to
      # gate further: only proceed if whoever dispatched it has Admin permission on the repo. Org owners
      # always show up as Admin here too, so this alone covers both repo Admins and org Owners.
      - name: Ensure publisher has admin access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERMISSION=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq .permission)
          if [ "$PERMISSION" != "admin" ]; then
            echo "::error::${{ github.actor }} has '$PERMISSION' permission, not 'admin'. Only repo Admins/org Owners may publish."
            exit 1
          fi

      # workflow_dispatch can be run against any branch/tag that contains this workflow file - without this
      # check dispatching from a non-main ref would silently publish code that was never reviewed on main.
      - name: Ensure publish runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish must be dispatched from main (got '${{ github.ref }}')."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # Core.csproj carries no <Version> of its own - the version always comes from the "version" input to
      # this workflow, and this step fails the run rather than falling back to any default if it's missing
      # or malformed.
      - name: Determine package version
        id: version
        env:
          # Passed through env instead of interpolated directly into the script below - this input is
          # arbitrary free text, and GitHub expressions are substituted textually before the shell runs, so
          # interpolating it inline would let a crafted "version" break out of the string and inject commands.
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Version '$VERSION' is not a valid version (expected e.g. 1.2.3)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "override=-p:Version=$VERSION" >> "$GITHUB_OUTPUT"

      # Dispatching this workflow is the only way a release gets cut - creates the tag (pointing at the
      # exact commit this run checked out) and the GitHub Release together, with auto-generated notes.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.version }}" --target "${{ github.sha }}" --title "${{ steps.version.outputs.version }}" --generate-notes

      - name: Pack
        # GeneratePackageOnBuild (Core/Core.csproj) is only meant to fire from `dotnet build`;
        # combined with an explicit `dotnet pack` invocation it conflicts with `pack`'s own
        # Build-then-Pack target ordering and the build never runs (NU5026: DLL not found).
        # Disabling it here lets `dotnet pack`'s own wiring build first as normal.
        run: dotnet pack Core/Core.csproj --configuration Release --output nupkgs -p:GeneratePackageOnBuild=false -p:RestoreLockedMode=true ${{ steps.version.outputs.override }}

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.version }}" nupkgs/*.nupkg nupkgs/*.snupkg
